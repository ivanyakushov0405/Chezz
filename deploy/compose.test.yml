# Тестовая БД для локальных прогонов (OPERATIONS §6.4, TESTING §7.1).
# Запуск: npm run db:test:up  (= docker compose -f deploy/compose.test.yml up -d --wait)
# Пароль chezz — не секрет, только для этого контейнера; порт только на 127.0.0.1.
# TEST_DATABASE_URL=postgres://chezz:chezz@127.0.0.1:54329/postgres
name: chezz-test

services:
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: chezz
      POSTGRES_PASSWORD: chezz
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chezz -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
