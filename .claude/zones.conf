# Зоны агентов: <зона> <allow|deny|param> <шаблон>. Формат — .claude/kit/PROFILE_FORMAT.md.
# Базовые зоны приходят с набором. Проектные зоны (tests и разработчики) дописывает profile-builder на /setup.

# --- всегда разрешено: журналы (только своей фичи — {slug})
always          allow  docs/features/{slug}/log.md
always          allow  docs/features/{slug}/test-run.log
always          allow  docs/setup/log.md

# --- этап /setup
setup-author    allow  docs/*.md
setup-author    allow  docs/adr/**
setup-author    allow  docs/setup/BUSINESS.md
setup-author    allow  docs/setup/reviews/*-response-r*.md
setup-author    deny   docs/TZ.md
setup-critic    allow  docs/setup/reviews/*.md
setup-critic    deny   docs/setup/reviews/*-response-r*.md
setup-pipeline  allow  .claude/agents/*.md
setup-pipeline  allow  .claude/profile.md
setup-pipeline  allow  .claude/zones.conf
setup-pipeline  allow  CLAUDE.md
setup-pipeline  allow  **/CLAUDE.md
setup-pipeline  allow  docs/PIPELINE_DECISIONS.md

# --- документы фич и roadmap
analyst         allow  docs/features/{slug}/requirements.md
roadmap         allow  docs/ROADMAP.md
designer        allow  docs/features/{slug}/design-spec.md
architect       allow  docs/features/{slug}/design.md
architect       allow  docs/adr/**
review          allow  docs/features/{slug}/review.md
# architect в режиме apply — согласованные человеком правки документов основ
architect-apply allow  docs/*.md
architect-apply allow  docs/adr/**
architect-apply allow  CLAUDE.md
architect-apply allow  **/CLAUDE.md
architect-apply deny   docs/TZ.md
architect-apply deny   docs/ROADMAP.md

# --- проектные зоны (дописывает profile-builder)
# Источник путей — TESTING §5 (tests), ARCHITECTURE §13 (код), OPERATIONS §15 (devops). Решения — docs/PIPELINE_DECISIONS.md.

# tests — тесты тестировщика (TESTING §5); метка [e2e]
tests           allow  apps/server/test/contract/**
tests           allow  apps/server/test/acceptance/**
tests           allow  packages/chess/test/**
tests           allow  fixtures/**
tests           allow  tests/**

# contracts — общие пакеты сервера и клиента (API §15, ARCHITECTURE §10); метка [contracts], backend-dev
contracts       allow  packages/protocol/**
contracts       allow  packages/chess/**
contracts       allow  scripts/check-api-doc.sh
# корень workspace — только свой блок (ссылка tsconfig, проект Vitest, правила ESLint, вызов check-api-doc.sh в check, зависимости); задачи идут по очереди — один писатель на задачу (PIPELINE_DECISIONS §2)
contracts       allow  package.json
contracts       allow  package-lock.json
contracts       allow  tsconfig.json
contracts       allow  vitest.config.ts
contracts       allow  eslint.config.*
contracts       deny   packages/chess/test/**

# backend — модуль apps/server/src/<module> (ARCHITECTURE §7.1); метка [backend:<module>], backend-dev
# общие пути сервера и корневые конфиги скелета (TESTING §11) — для любого модуля
backend         param  platform analytics users feedback auth rating games challenges matchmaking profile seo realtime
backend         allow  apps/server/src/{param}/**
backend         allow  apps/server/src/*.ts
backend         allow  apps/server/migrations/**
backend         allow  apps/server/test/support/**
backend         allow  apps/server/scripts/**
backend         allow  apps/server/package.json
backend         allow  apps/server/tsconfig*.json
backend         allow  package.json
backend         allow  package-lock.json
backend         allow  tsconfig*.json
backend         allow  vitest.config.ts
backend         allow  eslint.config.*
backend         allow  .dependency-cruiser.cjs
backend         allow  .nvmrc
backend         allow  .gitignore
backend         allow  .gitattributes
backend         allow  .env.example
backend         allow  scripts/check-architecture.sh
backend         allow  scripts/check-bundle.sh
backend         allow  LICENSE
backend         allow  README.md
backend         deny   apps/server/test/contract/**
backend         deny   apps/server/test/acceptance/**
backend         deny   packages/chess/test/**
backend         deny   fixtures/**
backend         deny   tests/**

# frontend — SPA и переводы (ARCHITECTURE §12, DESIGN); метка [frontend], frontend-dev
frontend        allow  apps/web/**
frontend        allow  packages/i18n/**
frontend        allow  package-lock.json
# корень workspace — только свой блок (ссылка tsconfig на apps/web и tests/e2e, проект Vitest с jsdom, правила ESLint React, Stylelint в check); по очереди (PIPELINE_DECISIONS §2)
frontend        allow  package.json
frontend        allow  tsconfig.json
frontend        allow  vitest.config.ts
frontend        allow  eslint.config.*
# проверки правил фронта (TESTING §11: правит тот, кто меняет правило; задачи идут по очереди)
frontend        allow  scripts/check-architecture.sh
frontend        allow  scripts/check-bundle.sh
frontend        deny   apps/web/CLAUDE.md
frontend        deny   apps/server/test/contract/**
frontend        deny   apps/server/test/acceptance/**
frontend        deny   packages/chess/test/**
frontend        deny   fixtures/**
frontend        deny   tests/**

# devops — VPS, compose, скрипты на VPS и для Ivan, CI (OPERATIONS §15 «агенты»); метки [infra], [ci]
devops          allow  deploy/**
devops          allow  scripts/ops/**
devops          allow  .github/**
devops          allow  scripts/check-workflows.sh
# контекст сборки — корень workspace (OPERATIONS §6.2)
devops          allow  .dockerignore
# правило OPERATIONS §1 (example.com) проверяет check-architecture.sh (OPERATIONS §8)
devops          allow  scripts/check-architecture.sh
devops          deny   deploy/CLAUDE.md
devops          deny   apps/server/test/contract/**
devops          deny   apps/server/test/acceptance/**
devops          deny   packages/chess/test/**
devops          deny   fixtures/**
devops          deny   tests/**
